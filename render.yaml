services:
  - type: web
    name: pandora-eticket
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input && python manage.py seed_data"
    startCommand: "gunicorn pandora.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pandora-db-new
          property: connectionString

databases:
  - name: pandora-db-new
    plan: free
    region: frankfurt
    databaseName: pandora_eticket
    user: pandora_admin
