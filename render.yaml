services:
  - type: web
    name: pandora-eticket
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input && python manage.py seed_data && python manage.py regenerate_qr"
    startCommand: "gunicorn pandora.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pandora-db
          property: connectionString

databases:
  - name: pandora-db
    plan: free
    region: frankfurt
    databaseName: pandora_eticket
    user: pandora_admin
